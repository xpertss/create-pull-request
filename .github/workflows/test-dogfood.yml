# Purpose: End-to-end dogfood test running the action against this repo.

name: test-dogfood
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  schedule:
    - cron: 17 3 * * *
jobs:
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: "Create path: fixture"
        id: create_path_fixture
        run: echo "$(date -u +%Y%m%dT%H%M%SZ)" >> test/fixtures/dogfood-state.txt
      - name: "Create path: run the action"
        id: create
        uses: ./
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          commit-message: "test: dogfood ${{ github.run_id }}"
          branch: test/dogfood
          base: main
          labels: dogfood-test
      - name: "Create path: assert"
        id: create_path_assert
        run: |-
          set -euo pipefail
          [ "${{ steps.create.outputs.pull-number }}" -gt 0 ]
          [ -n "${{ steps.create.outputs.head-sha }}" ]
          [ -n "${{ steps.create.outputs.pull-request }}" ]
          gh pr view test/dogfood --json state --jq .state | grep -qx open
          gh pr view test/dogfood --json labels --jq '.labels[].name' | grep -qx dogfood-test
      - name: "Re-run path: fixture"
        id: re-run_path_fixture
        run: echo "$(date -u +%Y%m%dT%H%M%SZ)" >> test/fixtures/dogfood-state.txt
      - name: "Re-run path: run the action"
        id: rerun
        uses: ./
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          commit-message: "test: dogfood ${{ github.run_id }}"
          branch: test/dogfood
          base: main
          labels: dogfood-test
      - name: "Re-run path: assert"
        id: re-run_path_assert
        run: |-
          set -euo pipefail
          [ "${{ steps.rerun.outputs.pull-number }}" -gt 0 ]
          [ "${{ steps.rerun.outputs.pull-number }}" = "${{ steps.create.outputs.pull-number }}" ]
      - name: Cleanup
        id: cleanup
        if: always()
        run: |-
          set -uo pipefail
          gh pr list --head test/dogfood --state open --json number --jq '.[].number' | while read -r n; do gh pr close "$n" --yes || true; done
          git push origin --delete test/dogfood || true
